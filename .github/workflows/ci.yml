name: CI

on:
  push:
    branches: [main, '*.*.x']
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push cancels the in-flight check of the same branch instead of spending Windows minutes on
# a superseded commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    # The gate suite is seconds of work; the minute is runner startup. A hung runner should burn 15,
    # not the 360 default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Self-measured: the local evidence baseline for every gate is SDK 10.0.204 (no global.json),
          # so the runner reproduces that machine. Mixing majors over one obj/ fails NETSDK1047.
          # net472 targeting resolves from NuGet (Krafs.Rimworld.Ref) either way.
          dotnet-version: '10.0.x'

      - name: Restore
        shell: pwsh
        run: |
          # verify-local runs its build gates with --no-restore, so a clean checkout needs an obj/
          # for every project. Glob rather than a hand list, so a new tools/ project is never forgotten.
          Get-ChildItem -Path Source,tools -Recurse -Filter *.csproj |
            ForEach-Object {
              dotnet restore $_.FullName --nologo
              if ($LASTEXITCODE -ne 0) { throw "dotnet restore failed for project $($_.FullName) (exit $LASTEXITCODE)." }
            }

      # Aligns with the UniversalSqueaker flow: the gates a maintainer would run by hand are the
      # gates CI runs, so a push cannot be green locally and untested on the runner.
      - name: Verify (12 gates)
        shell: pwsh
        run: ./scripts/verify-local.ps1 -NoRestore

      - name: Privacy audit (complete reachable history)
        shell: pwsh
        run: ./scripts/privacy-audit.ps1 -FullHistory

      - name: Build (Dev flavor)
        run: dotnet build Source/SqueakyRatkin/SqueakyRatkin.csproj -c Release -p:SqueakyBuildFlavor=Dev

      - name: Pack (commit-hash named dev snapshot)
        if: github.event_name == 'push'
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/pack-dev.ps1
          Compress-Archive -Path dist/dev/SqueakyRatkin -DestinationPath dist/dev/SqueakyRatkin-dev-${{ github.sha }}.zip -Force

      - name: Upload dev artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: SqueakyRatkin-dev-${{ github.sha }}
          path: dist/dev/*.zip
          retention-days: 14
